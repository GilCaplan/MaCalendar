<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" style="color:#e6e4dd;background:#15171c;font-family:IBM Plex Sans,Helvetica,Arial,sans-serif" role="img" aria-label="Flow of a voice command: phone or Mac audio goes to Whisper, is corrected by the personal vocabulary, tried by the rule parser, escalated to the local LLM with retrieved history when needed, validated, executed as actions against SQLite, and answered by TTS. Edits and word fixes feed back into memory and vocabulary.">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
        <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5a524"/></marker>
        <marker id="ar-learn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fb3a9"/></marker>
      </defs><rect width="1200" height="600" fill="#15171c"/>
      <g fill="none" stroke="currentColor" stroke-width="1.2" font-size="12" color="currentColor">

        <!-- lane labels -->
        <text x="20" y="34" fill="currentColor" font-size="11" letter-spacing="1.5" font-weight="600" stroke="none" opacity=".6">COMMAND PATH</text>
        <text x="20" y="452" fill="currentColor" font-size="11" letter-spacing="1.5" font-weight="600" stroke="none" opacity=".6">LEARNING LOOP</text>
        <line x1="20" y1="440" x2="1180" y2="440" stroke-dasharray="2 4" opacity=".5"/>

        <!-- Clients -->
        <rect x="20" y="120" width="120" height="58" rx="5"/>
        <text x="80" y="144" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">iPhone app</text>
        <text x="80" y="162" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">POST /voice/stream</text>

        <rect x="20" y="200" width="120" height="58" rx="5"/>
        <text x="80" y="224" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Mac app</text>
        <text x="80" y="242" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">⌃J hotkey · in-process</text>

        <!-- STT -->
        <rect x="190" y="150" width="130" height="78" rx="5"/>
        <text x="255" y="174" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Whisper STT</text>
        <text x="255" y="192" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">faster-whisper · local</text>
        <text x="255" y="212" text-anchor="middle" fill="#b48aef" stroke="none" font-size="11">+ vocab prompt bias</text>

        <line x1="140" y1="149" x2="190" y2="176" marker-end="url(#ar)"/>
        <text x="152" y="152" fill="currentColor" stroke="none" font-size="10.5" opacity=".7">wav</text>
        <line x1="140" y1="229" x2="190" y2="202" marker-end="url(#ar)"/>

        <!-- Vocab correct -->
        <rect x="360" y="150" width="130" height="78" rx="5" stroke="#b48aef"/>
        <text x="425" y="174" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Vocab auto-correct</text>
        <text x="425" y="192" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">alias hit or fuzzy ≥ 0.80</text>
        <text x="425" y="212" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">"Shawl" → "Shaul"</text>
        <line x1="320" y1="189" x2="360" y2="189" marker-end="url(#ar)"/>
        <text x="340" y="182" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity=".7">text</text>

        <!-- Rule parser -->
        <rect x="530" y="150" width="140" height="78" rx="5"/>
        <text x="600" y="174" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Rule parser (NLU)</text>
        <text x="600" y="192" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">spaCy + date recognizer</text>
        <text x="600" y="212" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">confidence + slot check</text>
        <line x1="490" y1="189" x2="530" y2="189" marker-end="url(#ar)"/>

        <!-- Fast path (accent) straight to validate -->
        <path d="M670 170 L 760 170 L 760 90 L 890 90" stroke="#f5a524" stroke-width="2" marker-end="url(#ar-acc)"/>
        <text x="775" y="82" fill="#f5a524" stroke="none" font-size="11" font-weight="600">fast path · conf ≥ 0.85, no missing slots · ~0.1 s</text>

        <!-- LLM -->
        <rect x="720" y="160" width="150" height="88" rx="5"/>
        <text x="795" y="184" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">LLM reasoning</text>
        <text x="795" y="202" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">Ollama · llama3.1:8b</text>
        <text x="795" y="220" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">JSON-schema output</text>
        <text x="795" y="238" text-anchor="middle" fill="#b48aef" stroke="none" font-size="11">+ few-shot from memory</text>
        <line x1="670" y1="208" x2="720" y2="208" marker-end="url(#ar)"/>
        <text x="695" y="224" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity=".7">hybrid / full</text>

        <!-- Memory RAG -->
        <rect x="720" y="300" width="150" height="70" rx="5" stroke="#b48aef"/>
        <text x="795" y="324" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Command memory</text>
        <text x="795" y="342" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">past commands + corrections</text>
        <text x="795" y="358" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">nlu_memory.db</text>
        <line x1="795" y1="300" x2="795" y2="248" marker-end="url(#ar)"/>
        <text x="803" y="278" fill="currentColor" stroke="none" font-size="10.5" opacity=".7">k=4 similar</text>

        <!-- Vocab store -->
        <rect x="360" y="300" width="130" height="70" rx="5" stroke="#b48aef"/>
        <text x="425" y="324" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Vocabulary store</text>
        <text x="425" y="342" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">words + learned aliases</text>
        <text x="425" y="358" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">vocab.json</text>
        <line x1="425" y1="300" x2="425" y2="228" marker-end="url(#ar)"/>
        <path d="M360 335 L 255 335 L 255 228" marker-end="url(#ar)"/>
        <text x="300" y="329" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity=".7">initial_prompt</text>

        <!-- Validate + execute -->
        <rect x="900" y="60" width="130" height="58" rx="5"/>
        <text x="965" y="84" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Validate</text>
        <text x="965" y="102" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">pydantic intents</text>
        <line x1="870" y1="204" x2="900" y2="204" marker-end="url(#ar)"/>
        <rect x="900" y="175" width="130" height="58" rx="5"/>
        <text x="965" y="199" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Actions</text>
        <text x="965" y="217" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">create_event, create_todo…</text>
        <line x1="965" y1="118" x2="965" y2="175" marker-end="url(#ar)"/>

        <!-- DB -->
        <rect x="1070" y="175" width="110" height="58" rx="5"/>
        <text x="1125" y="199" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">SQLite</text>
        <text x="1125" y="217" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">calendar.db</text>
        <line x1="1030" y1="204" x2="1070" y2="204" marker-end="url(#ar)"/>
        <text x="1050" y="197" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity=".7">write</text>

        <!-- Response / verify -->
        <rect x="900" y="300" width="130" height="58" rx="5"/>
        <text x="965" y="324" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Reply + TTS</text>
        <text x="965" y="342" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">"Created event 'Walk Kyra'…"</text>
        <line x1="965" y1="233" x2="965" y2="300" marker-end="url(#ar)"/>
        <path d="M1030 330 L 1070 330 L 1070 262" stroke-dasharray="4 3" marker-end="url(#ar)"/>
        <rect x="1070" y="262" width="0" height="0"/>
        <text x="1125" y="290" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">fast-path verify</text>
        <text x="1125" y="306" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">(LLM, background)</text>

        <!-- Trace stream back to phone (dashed) -->
        <path d="M900 330 L 600 330 L 600 250 L 80 250 L 80 178" stroke-dasharray="5 4" opacity=".75" marker-end="url(#ar)"/>
        <text x="600" y="322" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity=".7">live "thinking" trace · one line per stage</text>

        <!-- LEARNING LOOP -->
        <rect x="900" y="480" width="200" height="58" rx="5"/>
        <text x="1000" y="504" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">You edit / delete the event</text>
        <text x="1000" y="522" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">on phone or Mac, within 24 h</text>
        <line x1="1125" y1="233" x2="1125" y2="470" stroke="#4fb3a9" opacity=".35"/>
        <path d="M900 509 L 795 509 L 795 370" stroke="#4fb3a9" stroke-width="1.6" marker-end="url(#ar-learn)"/>
        <text x="840" y="500" text-anchor="middle" fill="#4fb3a9" stroke="none" font-size="10.5">"corrected" / "rejected"</text>

        <rect x="530" y="480" width="200" height="58" rx="5"/>
        <text x="630" y="504" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">You tap a misheard word</text>
        <text x="630" y="522" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">Settings › Vocabulary · "Shawl → Shaul"</text>
        <path d="M530 509 L 425 509 L 425 370" stroke="#4fb3a9" stroke-width="1.6" marker-end="url(#ar-learn)"/>
        <text x="470" y="500" text-anchor="middle" fill="#4fb3a9" stroke="none" font-size="10.5">new alias</text>

        <rect x="190" y="480" width="200" height="58" rx="5"/>
        <text x="290" y="504" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Every command is stored</text>
        <text x="290" y="522" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65" font-size="11">transcript → intents → result → timings</text>
        <path d="M390 509 L 700 509 L 700 380 L 720 360" stroke="#4fb3a9" stroke-width="1.6" opacity=".55"/>
        <path d="M720 360 L 720 360" stroke="#4fb3a9"/>
      </g>
    </svg>