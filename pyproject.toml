[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant*"]
exclude = ["DOCUMENTATION*", "tests*", "MACalendar-iOS*"]

[project]
name = "assistant-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "pynput==1.7.7",
    "sounddevice==0.5.1",
    "numpy==1.26.4",
    "faster-whisper==1.1.0",
    "SpeechRecognition==3.11.0",
    "requests==2.32.3",
    "msal==1.31.0",
    "pydantic>=2.0",
    "pyyaml==6.0.2",
    "python-dateutil==2.9.0",
    "pytz==2024.1",
    "pyluach>=2.3.0",
    # Sunset/nightfall for workout scheduling. Pure Python, fully offline.
    "astral>=3.2",
    "Flask>=3.0",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4"]   # Whisper on Apple Silicon GPU (stt_engine: "mlx")
nlp = [
    "spacy>=3.7,<4.0",
    "recognizers-text-date-time>=1.0.2a0",
    # recognizers-text-date-time imports emoji.UNICODE_EMOJI, removed in emoji 2.0
    # (Aug 2021). Without this pin, a fresh resolve silently breaks date parsing:
    # the DateTime recognizer catches the ImportError, logs a warning, and disables
    # itself — every "on friday"/"next wednesday" style command loses its date.
    "emoji<2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock",
    "pytest-cov",
    "spacy>=3.7,<4.0",
    "recognizers-text-date-time>=1.0.2a0",
    "emoji<2.0",
    "soundfile>=0.12",  # tests/audio/ — macOS-only STT round-trip tests
]

[project.scripts]
assistant = "assistant.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
